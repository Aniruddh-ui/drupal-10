# Schema definition for FOSSEE Event module configuration.
# Ensures config values are validated and typed correctly.

fossee_event.settings:
  type: config_object
  label: 'FOSSEE Event settings'
  mapping:
    admin_notification_email:
      type: email
      label: 'Admin notification email'
    admin_notification_enabled:
      type: boolean
      label: 'Admin notification enabled'
    user_confirmation_enabled:
      type: boolean
      label: 'User confirmation enabled'
